name: waktu_solat
description: Paparan waktu solat untuk rumah dan masjid.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  geolocator: ^14.0.0
  file_picker: ^10.1.0
  window_manager: ^0.5.0
  wakelock_plus: ^1.3.0
  launch_at_startup: ^0.5.1
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/admin.html
    - assets/beep.wav
